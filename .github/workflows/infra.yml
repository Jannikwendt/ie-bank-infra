name: ie-bank-infra

on:
  # ---- manual button ----
  workflow_dispatch:

  # ---- Dev: any branch except main ----
  push:
    branches-ignore: [ main ]
    paths-ignore:   [ 'scripts/**' ]

  # ---- UAT: PRs that target main + merge on main ----
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  SUBSCRIPTION_ID: e0b9cada-61bc-4b5a-bd7a-52c606726b3b
  RG_NAME:         BCSAI2024-DEVOPS-RETAKERS-DEV   # <-- your resource-group
  USER_ALIAS:      jwendt
  PARAM_FILE_DEV:  dev.bicepparam
  PARAM_FILE_UAT:  uat.bicepparam

jobs:
# ──────────────────────────── BUILD ────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep lint
        run: az bicep build --file main.bicep

# ──────────────────────────── DEPLOY ───────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Azure login via OIDC
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # pick the right param file
      - id: pick
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "file=${{ env.PARAM_FILE_DEV }}" >> $GITHUB_OUTPUT
          else
            echo "file=${{ env.PARAM_FILE_UAT }}" >> $GITHUB_OUTPUT
          fi

      # deploy
      - name: Deploy Bicep
        uses: azure/arm-deploy@v1
        with:
          subscriptionId:   ${{ env.SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.RG_NAME }}
          deploymentName:   "${{ env.USER_ALIAS }}-${{ github.run_number }}"
          template:         main.bicep
          parameters: |
            ${{ steps.pick.outputs.file }}
            dbAdminPassword=${{ secrets.DBPASS }}
            appServiceAPIEnvVarDBPASS=${{ secrets.DBPASS }}
            appServiceAPIDBHostDBUSER=${{ secrets.DBUSER }}
