name: ie-bank-infra

on:
  # Dev  ➜ any push to any branch except main
  push:
    branches-ignore: [ main ]
  # UAT ➜ PRs that target main  **and** the merge-commit on main
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # 👇  change ONLY these three values to match your own subscription & RGs
  SUBSCRIPTION_ID_DEV:  e0b9cada-61bc-4b5a-bd7a-52c606726b3b
  RESOURCE_GROUP_DEV:   BCSAI2024-DEVOPS-RETAKERS-DEV
  RESOURCE_GROUP_UAT:   BCSAI2024-DEVOPS-RETAKERS-UAT   # (create via portal if absent)
  USER_ALIAS:           jwendt

jobs:
# ───── Build (lint) ───────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run Bicep linter
      run: az bicep build --file ./main.bicep

# ───── Deploy Dev ────────────────────────────────────────────────
  deploy-dev:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: Development
    permissions:
      id-token: write   # OIDC login
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Deploy Bicep (Dev)
      uses: azure/arm-deploy@v2
      with:
        subscriptionId:   ${{ env.SUBSCRIPTION_ID_DEV }}
        resourceGroupName: ${{ env.RESOURCE_GROUP_DEV }}
        template:          ./main.bicep
        parameters:        ./parameters/dev.bicepparam
        parameters:        dbAdminPassword=${{ secrets.DB_ADMIN_PASSWORD }}
        deploymentName:    ${{ env.USER_ALIAS }}-dev-${{ github.run_number }}

# ───── Deploy UAT ────────────────────────────────────────────────
  deploy-uat:
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main'
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment: UAT
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Deploy Bicep (UAT)
      uses: azure/arm-deploy@v2
      with:
        subscriptionId:   ${{ env.SUBSCRIPTION_ID_DEV }}
        resourceGroupName: ${{ env.RESOURCE_GROUP_UAT }}
        template:          ./main.bicep
        parameters:        ./parameters/uat.bicepparam
        parameters:        dbAdminPassword=${{ secrets.DB_ADMIN_PASSWORD }}
        deploymentName:    ${{ env.USER_ALIAS }}-uat-${{ github.run_number }}
