name: ie-bank-infra

on:
  # Dev → any branch except main
  push:
    branches-ignore: [ main ]
  # UAT → PRs targeting main  +  merge commit on main
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  RG_NAME:            ie-bank              # reuse the same RG
  LOCATION:           westeurope           # change if you like
  # which bicep param file to use
  PARAM_FILE_DEV:     dev.bicepparam
  PARAM_FILE_UAT:     uat.bicepparam

jobs:
# ─────────── BUILD (lint/compile) ──────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep lint
        run: az bicep build --file main.bicep

# ─────────── DEPLOY  ──────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # for OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Select param file
        id: pick
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "file=${PARAM_FILE_DEV}"      >> $GITHUB_OUTPUT
          else
            echo "file=${PARAM_FILE_UAT}"      >> $GITHUB_OUTPUT
          fi

      - name: Deploy Bicep
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group   $RG_NAME \
              --name            "iebank-${{ github.run_number }}" \
              --template-file    main.bicep \
              --parameters       ${{ steps.pick.outputs.file }} \
              --parameters       dbAdminPassword='${{ secrets.DB_ADMIN_PASSWORD }}'
